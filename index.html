<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Story Trail">
<meta name="theme-color" content="#2d2865">
<link rel="apple-touch-icon" href="icon.png">
<title>Brighton Story Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Map fills the screen, a bottom card drives the walk stop by stop. Colours lifted from the printed trail map. */
:root{
  --navy:#2d2865; --sky:#8ecbea; --gold:#f5c84c; --pink:#ec1773; --green:#6dbb94;
  --bg:#f3f7fb; --card:#ffffff; --fg:#1d1a45; --muted:#5d5a86; --line:#dbe3ee; --ring:rgba(236,23,115,.35);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132e;--card:#211e47;--fg:#f1f0ff;--muted:#b3b0dc;--line:#37336a;--ring:rgba(255,94,163,.4);--pink:#ff3d8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15132e;--card:#211e47;--fg:#f1f0ff;--muted:#b3b0dc;--line:#37336a;--ring:rgba(255,94,163,.4);--pink:#ff3d8f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
header h1{font:800 20px/1 var(--display);margin:0;letter-spacing:-.01em;flex:1;min-width:0}
header h1 span{color:var(--gold)}
.count{font:600 13px var(--body);background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--navy)}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s ease}
.map{position:relative;flex:1;overflow:hidden;background:#8ecbea;touch-action:none;cursor:grab}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer.fly{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.layer img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pulse{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:5px solid var(--pink);box-shadow:0 0 0 8px var(--ring);pointer-events:none;animation:p 1.6s ease-out infinite}
@keyframes p{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.4);opacity:.15}}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button,.fab{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);color:var(--fg);font:700 20px var(--body);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.sheet{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,18,60,.12);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;gap:10px}
.stopno{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font:800 18px var(--display)}
.stopno small{display:block;font:600 9px var(--body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:-6px;opacity:.85}
.meta{flex:1;min-width:0}
.meta b{display:block;font:800 18px/1.15 var(--display);text-wrap:balance}
.meta span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:6px}
.nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font:700 18px var(--body);cursor:pointer}
.nav button:disabled{opacity:.3}
ul.sc{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
ul.sc li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg);cursor:pointer}
ul.sc li .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 12px var(--body)}
ul.sc li .t{flex:1;min-width:0}
ul.sc li .t b{display:block;font-weight:600}
ul.sc li .t em{font-style:normal;color:var(--muted);font-size:12.5px}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;transition:all .2s}
li.found .tick{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.08)}
li.found .t b{text-decoration:line-through;text-decoration-color:var(--green)}
.actions{display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:14px;border:0;font:700 15px var(--body);text-decoration:none;cursor:pointer}
.go{background:var(--navy);color:#fff}
.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.list{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.list header{position:sticky;top:0}
.list .scroll{overflow:auto;flex:1;padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.list .item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item .stopno{width:34px;height:34px;font-size:14px}
.list .item.done .stopno{background:var(--green)}
.list .item .meta b{font-size:15px}
.close{background:transparent;border:0;color:#fff;font:600 15px var(--body);cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:var(--navy);font:800 16px var(--display);padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:all .3s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.layer.fly{transition:none}}
.me{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);pointer-events:none;z-index:2}
.acc{position:absolute;border-radius:50%;background:rgba(26,115,232,.15);border:1px solid rgba(26,115,232,.4);pointer-events:none}
.loc{font-size:18px!important;color:#1a73e8!important}
.loc.on{background:#1a73e8!important;color:#fff!important}
.gpsnote{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:64px;top:58px;background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.away{color:var(--pink);font-weight:600}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
.app>header,.list>header{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.list{padding-top:0}
.sheet{max-height:58%;overflow-y:auto;overscroll-behavior:contain}
.local{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
ul.sc li{flex-wrap:wrap}
.info{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:italic 700 14px Georgia,serif;cursor:pointer}
.info[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.detail{flex-basis:100%;font-size:13.5px;line-height:1.5;padding:4px 2px 2px 36px;cursor:auto}
.detail p{margin:0 0 6px}
.detail .spot{color:var(--muted)}
.detail .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin:2px 0 8px;background:var(--bg)}
.detail a{color:var(--pink);font-weight:600}
.wake{font:600 11px var(--body);color:var(--gold);white-space:nowrap}
.sv{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:3px solid var(--pink);display:grid;place-items:center;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sv svg{width:14px;height:14px;fill:var(--pink)}
.sv.done{background:var(--green);border-color:var(--green)}.sv.done svg{fill:#fff}
.svh{margin:26px 0 2px;font:800 20px var(--display)}
.svh+p{margin:0 0 6px;color:var(--muted);font-size:13px}
.venue{margin:16px 0 0;font:700 14px var(--body);display:flex;justify-content:space-between;gap:8px}
.venue span{color:var(--muted);font-variant-numeric:tabular-nums}
.detail .hours{color:var(--muted);white-space:pre-line}
.filter{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;gap:2px;padding:3px;background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.filter button{border:0;background:transparent;color:var(--fg);font:600 13px var(--body);padding:7px 11px;border-radius:9px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--navy);color:#fff}
select.sroute{display:block;width:100%;margin:0 0 6px;font:600 14px var(--body);padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Brighton <span>Story Trail</span></h1>
    <span class="wake" id="wake" hidden>Screen stays on</span>
    <span class="count" id="count">0 / 32 found</span>
    <button class="fab" id="openList" aria-label="All stops" style="width:auto;padding:0 12px;font-size:14px;height:34px">All stops</button>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="map" id="map">
    <div class="layer" id="layer"><img id="img" src="map.jpg" alt="Story Trail map with the walking route"><div class="pulse" id="pulse"></div><div class="acc" id="acc" hidden></div><div class="me" id="me" hidden></div></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zall" aria-label="Whole map" style="font-size:14px">&#9635;</button><button id="loc" aria-label="Show my location" class="loc">&#10148;</button></div>
    <div class="filter" id="filter" role="group" aria-label="Benches to show"><button data-f="big">Big</button><button data-f="small">Small</button><button data-f="both">Both</button></div>
    <div class="gpsnote" id="gpsnote" hidden></div>
  </div>
  <section class="sheet" id="sheet">
    <div class="row">
      <div class="stopno" id="stopno"><div><small>Stop</small>1</div></div>
      <div class="meta"><b id="place">Churchill Square</b><span id="dist"></span><span id="away" class="away"></span></div>
      <div class="nav"><button id="prev" aria-label="Previous stop">&#8249;</button><button id="next" aria-label="Next stop">&#8250;</button></div>
    </div>
    <p class="local" id="local"></p>
    <ul class="sc" id="sc"></ul>
    <div class="actions">
      <a class="btn go" id="walk" target="_blank" rel="noopener">Walk there</a>
      <button class="btn ghost" id="show">Show on map</button>
    </div>
  </section>
</div>
<div class="list" id="list" hidden>
  <header><h1>All <span>29 stops</span></h1><button class="close" id="closeList">Done</button></header>
  <div class="scroll" id="items"></div>
</div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<script>
const DATA={"w": 2201, "h": 1672, "start": {"x": 1436, "y": 1082}, "stops": [{"n": 1, "km": 0.23, "leg": 226, "lat": 50.8236, "lon": -0.14542, "sculptures": [{"id": 29, "title": "All Hail Brighton", "artist": "Martha Mitchell", "place": "Churchill Square (outside)", "x": 1349, "y": 1209, "about": "This BookBench celebrates everything we love about Brighton. Inspired by the city’s beautiful seaside setting, iconic landmarks, and rich creative spirit, the sculpture reflects Brighton’s vibrant, diverse, and welcoming character. Drawing on the energy and charm that make the city so distinctive, the design aims to capture Brighton’s unique identity and sense of community. Martha has lived in Brighton since she was 8 and feels very lucky to call such a wonderful city her home -it has been very special to be able to reflect that in her BookBench.", "spot": "The sculpture will be situated outside Churchill Square shopping centre.", "url": "https://amazesussex.org.uk/sculptures/all-hail-brighton/", "photo": "photos/bench-29.jpg", "lat": 50.8236, "lon": -0.14542}, {"id": 30, "title": "Lazy Cats", "artist": "Judith Berrill and Peter Poole", "place": "Churchill Square (inside)", "x": 1327, "y": 1282, "about": "Anyone who has lived with cats will know that they all love a cushioned couch and that it’s called FURniture for a reason! This bench was designed by Peter Poole, a talented Brighton artist who sadly passed away in March 2026 after a short but hard-fought battle with cancer. Peter’s inspiration for the design was based on his sister’s two cats, Angel and Buddy. Peter’s design is painted by Judith Berrill who knew Peter from previous sculpture trails and always admired his beautifully witty painted sculptures. Judith has completed over 20 street sculptures, the sales of which have raised over £100k.", "spot": "This sculpture is situated inside Churchill Square shopping centre on the ground floor by the Albion shop and the information desk.", "url": "https://amazesussex.org.uk/sculptures/lazy-cats/", "photo": "photos/bench-30.jpg", "lat": 50.82244, "lon": -0.14592}, {"id": 31, "title": "Benchy", "artist": "Style in Design and MakeGood Design", "place": "Churchill Square, Story Trail HQ", "x": 1318, "y": 1232, "about": "Benchy is our cheeky mascot of The Story Trail. Created by Emma from Style in Design, based on the designs of MakeGood Design. You can win Benchy by entering our raffle for just £5! All money raised will go towards Amaze.", "spot": "The sculpture will be located inside The Story Trail HQ, inside Churchill Square.", "url": "https://amazesussex.org.uk/sculptures/benchy/", "photo": "photos/bench-31.jpg", "lat": 50.82311, "lon": -0.145}], "local": "Churchill Square opened in 1968 and was rebuilt as an indoor shopping centre in 1998. Benchy is up on level 6 at the Story Trail HQ, opposite Sunglass Hut and Office."}, {"n": 2, "km": 0.76, "leg": 535, "lat": 50.82109, "lon": -0.14951, "sculptures": [{"id": 20, "title": "Sweet Seat", "artist": "Georgina Luck", "place": "Golden Spiral", "x": 1220, "y": 1342, "about": "Sweet Seat is a colourful, uplifting design that symbolises community, continuity and care. Using acrylic inks the bench is adorned with Brighton rock sweets, each with the names of Brighton’s districts embedded all the way through. This references Brighton’s seaside heritage and Graham Greene’s Brighton Rock, where rock candy becomes a metaphor for morality and character — the idea that who we are runs through us unchanged.", "spot": "This sculpture will be located a couple of yards to the East of the I360, on the lower promenade.", "url": "https://amazesussex.org.uk/sculptures/sweet-seat/", "photo": "photos/bench-20.jpg", "lat": 50.82109, "lon": -0.14951}], "local": "The i360 viewing tower opened in 2016 on the site of the West Pier's landward end. The skeleton of the West Pier, which closed in 1975, still stands out at sea."}, {"n": 3, "km": 1.17, "leg": 404, "lat": 50.82222, "lon": -0.15454, "sculptures": [{"id": 21, "title": "Bandstand", "artist": "Serena Sussex", "place": "Band Stand", "x": 1057, "y": 1298, "about": "Serena decided to paint the bandstand with its beautiful iron work, a Grade II Listed Building designed by Phillip Lockwood and completed in 1884. As a table tennis player, she wanted to show one of the many activities that can be played near the bandstand, as well as portraying many visitors sightseeing by the seaside. The first layer of paint is a splash of bright colours, where she has then painted the negative space around the people and objects. The background sunset gives a warm glow to the scene.", "spot": "The sculpture is located outside of the Bandstand on Kings Road, slightly to the left when facing towards the sea.", "url": "https://amazesussex.org.uk/sculptures/bandstand/", "photo": "photos/bench-21.jpg", "lat": 50.82222, "lon": -0.15454}], "local": "The 'Birdcage' bandstand dates from 1884 and was restored in 2009. It is now a popular wedding venue."}, {"n": 4, "km": 1.35, "leg": 182, "lat": 50.82242, "lon": -0.15743, "sculptures": [{"id": 22, "title": "Tell Me A Story", "artist": "Pinky Vision", "place": "Peace Statue", "x": 938, "y": 1274, "about": "Everyone has a story to tell. This Book Bench design encourages people to take a moment to share stories with each other. Be they old friends, new acquaintances or family members. You are invited to take a seat and share your ideas, memories, experiences and fantasies with the world!", "spot": "The sculpture will be located a few yeards from the peace statue on the concrete before the lawn.", "url": "https://amazesussex.org.uk/sculptures/tell-me-a-story/", "photo": "photos/bench-22.jpg", "lat": 50.82242, "lon": -0.15743}], "local": "The Peace Statue was unveiled in 1912 as a memorial to King Edward VII. It stands on the old boundary between Brighton and Hove."}, {"n": 5, "km": 2.04, "leg": 688, "lat": 50.82339, "lon": -0.16564, "sculptures": [{"id": 23, "title": "Curious Creatures", "artist": "Claire Houlihan", "place": "Hove Lawns", "x": 643, "y": 1214, "about": "This design imagines a classic hardback book whose pages have burst open into a lush, untamed jungle. Inspired by the magic of storytelling and the way books transport us into wild new worlds, the bench blends deep burgundy bookbinding tones with vibrant foliage and curious creatures. It offers a subtle nod to Sussex’s literary heritage, inviting visitors to sit, pause, and step into a story that grows beyond the page. The jungle becomes a metaphor for imagination: alive, surprising, and wonderfully uncontained.", "spot": "The sculpture is located along Hove promenade, outside The Lawns Café.", "url": "https://amazesussex.org.uk/sculptures/curious-creatures/", "photo": "photos/bench-23.jpg", "lat": 50.82339, "lon": -0.16564}], "local": "Hove Lawns run along the seafront in front of Hove's rows of colourful beach huts."}, {"n": 6, "km": 2.45, "leg": 411, "lat": 50.82668, "lon": -0.16549, "sculptures": [{"id": 27, "title": "Alice in Wonderland", "artist": "Kirsti Davidson", "place": "The Book Nook (outside)", "x": 662, "y": 1053, "about": "This BookBench is inspired by Lewis Carroll’s surreal and iconic book Alice’s Adventures in Wonderland. It felt especially fitting as Carroll spent his summers in Brighton. Having previously worked in children’s publishing, Kirsti was excited to create a bold, bright and narrative design. One side celebrates Alice’s curiosity, featuring some much-loved characters, while the back depicts the wonderfully whimsical Mad Hatter’s tea party.", "spot": "The sculpture will be located outside The Book Nook on First Avenue in Hove.", "url": "https://amazesussex.org.uk/sculptures/alice-in-wonderland/", "photo": "photos/bench-27.jpg", "lat": 50.82668, "lon": -0.16549}, {"id": 32, "title": "Paint Me!", "artist": "Nila Aye, Nick Sharratt, Adam Stower, Liz Pichon, Vicky Woodgate, Sophy Henn, Steve Lenton and Guy Parker Rees.", "place": "The Book Nook (inside)", "x": 662, "y": 1031, "about": "The Book Nook in Hove is open Monday through Friday from 9:00 AM to 5:00 PM, and Saturday from 9:30 AM to 5:00 PM. They will also be open an extra day on Sunday from 11:00 AM to 3:00 PM as part of the trail.", "spot": "The sculpture will be located inside The Book Nook on First Avenue in Hove.", "url": "https://amazesussex.org.uk/sculptures/paint-me/", "photo": "photos/bench-32.jpg", "lat": 50.8265, "lon": -0.16564}], "local": "The Book Nook is an independent children's bookshop. Paint Me! is inside, decorated by a team of well-known children's illustrators."}, {"n": 7, "km": 2.93, "leg": 483, "lat": 50.82795, "lon": -0.17069, "sculptures": [{"id": 26, "title": "The Sussex Sídhe at Shadowfall", "artist": "Kat Irvine", "place": "Hove Town Hall", "x": 478, "y": 968, "about": "Step into a magical reimagining of Brighton, where at sundown, fairies dance across the Sussex skies, mythical creatures gather beneath the Royal Pavilion, and the sea breeze carries whispers of ancient enchantment. Inspired by the secret tunnels winding beneath the city, this fairytale weaves together folklore, Sussex charm, and whimsical wonder into a magical adventure. Through poetry, artwork, and storytelling, you are invited on a heartwarming journey of self-belief, joy, and the power of positivity. With hope, encouragement, and a little bit of imagination, anything is possible.", "spot": "The sculpture will be located outside of Hove Town Hall on Church Road by The Juggler statue.", "url": "https://amazesussex.org.uk/sculptures/the-sussex-sidhe-at-shadowfall/", "photo": "photos/bench-26.jpg", "lat": 50.82795, "lon": -0.17069}], "local": "The original Victorian town hall was destroyed by fire in 1966. The present building opened in 1974."}, {"n": 8, "km": 3.3, "leg": 367, "lat": 50.82882, "lon": -0.17382, "sculptures": [{"id": 25, "title": "Keep It Fun", "artist": "Ben Cavanagh", "place": "George Street", "x": 378, "y": 878, "about": "This sculpture celebrates Brighton’s creativity, energy and community. Inspired by the city’s vibrant street art and by Ben’s work with SEND young people, the design embraces a playful way of seeing the world. Packed with colourful details, it celebrates young people, families and the importance of support, inclusion and fun!", "spot": "The sculpture will be situated on George Street on the left-hand side when facing towards the sea.", "url": "https://amazesussex.org.uk/sculptures/keep-it-fun/", "photo": "photos/bench-25.jpg", "lat": 50.82882, "lon": -0.17382}], "local": "George Street is Hove's main pedestrianised shopping street, running between Church Road and Blatchington Road."}, {"n": 9, "km": 4.02, "leg": 723, "lat": 50.82952, "lon": -0.18121, "sculptures": [{"id": 24, "title": "A Seat For Friends", "artist": "Judith Berrill", "place": "Hove Museum", "x": 108, "y": 881, "about": "Take a moment to sit on this bench, smile, share a story, connect with someone new or discover fresh ideas, different cultures and memorable characters through a good book. Before you leave, don’t forget to say hello to the little mouse at the back. Judith is a Brighton-based artist with more than 30 years’ experience, after gaining her Fine Art degree from Leeds University. Her creative work spans book illustration, stage design, painting and graphic design. Judith has completed over 20 street sculptures, the sales of which have raised more than £100k for partner charities.", "spot": "The sculpture can be found at the entrance to Hove Museum, just off New Church Road.", "url": "https://amazesussex.org.uk/sculptures/a-seat-for-friends/", "photo": "photos/bench-24.jpg", "lat": 50.82952, "lon": -0.18121}], "local": "Hove Museum is housed in a villa built in 1877. It tells the story of the 'Hove pioneers' who made some of the world's earliest films here around 1900."}, {"n": 10, "km": 5.84, "leg": 1818, "lat": 50.83908, "lon": -0.17281, "sculptures": [{"id": 28, "title": "Rays of Resilience", "artist": "Kitty McCurdy", "place": "Hove Park", "x": 400, "y": 332, "about": "Rays of Resilience is inspired by the strength and resilience shown by children, young people, and families as they navigate challenges. Painted in a semi-abstract style, the bench uses expressive shapes, colour, and movement to create energy and optimism. The front shows the rolling South Downs with a nod to the Chattri War Memorial, reflecting Brighton and Hove’s heritage, while the back captures the city’s dramatic skies and seascape, with rays of light breaking through clouds. These rays symbolise hope, resilience, and positivity, central to Amaze and Kitty’s practice.", "spot": "The sculpture is located at the entrance to Hove Park just off Old Shoreham Road.", "url": "https://amazesussex.org.uk/sculptures/rays-of-resilience/", "photo": "photos/bench-28.jpg", "lat": 50.83908, "lon": -0.17281}], "local": "Hove Park opened in 1906. Look out for the Goldstone, a huge sarsen stone dug up in 1900 and placed in the park, which gave Albion's old Goldstone Ground its name."}, {"n": 11, "km": 8.02, "leg": 2183, "lat": 50.84271, "lon": -0.15003, "sculptures": [{"id": 1, "title": "The Secret Garden", "artist": "Tina Davies", "place": "Preston Manor", "x": 1203, "y": 139, "about": "Inspired by The Secret Garden, a story that has stayed with Tina since childhood, this bench celebrates hope and the healing power of nature. The robin, a guiding presence in the story, appears throughout the design, leading us into a hidden garden filled with flowers, butterflies, bees and hints of fairy magic. Through creating this bench, Tina wanted to capture the wonder, beauty and hopeful spirit at the heart of the book.", "spot": "The sculpture will be located at the front of Preston Manor on a patch of lawn by the main entrance.", "url": "https://amazesussex.org.uk/sculptures/the-secret-garden/", "photo": "photos/bench-1.jpg", "lat": 50.84271, "lon": -0.15003}], "local": "Preston Manor was rebuilt in 1738 and was home to the Stanford family. It was left to the town in 1932 and is often called one of the most haunted houses in Britain."}, {"n": 12, "km": 9.03, "leg": 1008, "lat": 50.83674, "lon": -0.14327, "sculptures": [{"id": 2, "title": "Blown Away", "artist": "Danielle Brooks", "place": "Preston Park", "x": 1427, "y": 426, "about": "The windy weather is a big part of the story when you live in Brighton. Inspired by blustery walks on the South Downs and windswept strolls along the seafront, this bench brings together some of our favourite landscapes and landmarks into one wonderful long dog walk. Consider it an invitation to soak up the stunning scenery that we have on our doorstep and embrace the adventure, whatever the weather.", "spot": "The sculpture will be located at the Southern entrance to Preston Park, in the section just before the rose garden.", "url": "https://amazesussex.org.uk/sculptures/blown-away/", "photo": "photos/bench-2.jpg", "lat": 50.83674, "lon": -0.14327}], "local": "The town bought Preston Park in 1883 with a bequest from William Edmund Davies. The Rose Garden is just past the bench."}, {"n": 13, "km": 9.61, "leg": 579, "lat": 50.834, "lon": -0.13865, "sculptures": [{"id": 4, "title": "Colour Me In", "artist": "Art and Believe", "place": "Preston Circus", "x": 1591, "y": 557, "about": "At Art and Believe, our roots come from painting large scale murals in urban and architectural landscapes all over the world. For our BookBench design we have taken inspiration from our travels and the different cultures we have visited to create a bold ‘Atlas of colour’, using a bright, colourful, geometric and linear design.", "spot": "Outside the Duke of York's Picturehouse, at the corner where Stanley Road meets Beaconsfield Road. The printed map marks it a little too far south.", "url": "https://amazesussex.org.uk/sculptures/colour-me-in/", "photo": "photos/bench-4.jpg", "lat": 50.834, "lon": -0.13865}], "local": "The Duke of York's Picturehouse opened in 1910 and is one of the oldest working cinemas in Britain. Look up for the striped can-can legs on the roof."}, {"n": 14, "km": 9.89, "leg": 286, "lat": 50.83135, "lon": -0.13523, "sculptures": [{"id": 3, "title": "100 Years of David", "artist": "The Postman", "place": "Open Market", "x": 1713, "y": 772, "about": "Created by anonymous street artists The Postman, this bench celebrates one of Britain’s greatest icons, Sir David Attenborough, on the occasion of his 100th birthday. Blending pop art, street culture and wildlife imagery, the piece pays tribute to a lifetime dedicated to inspiring a deeper connection with the natural world. More than a place to sit, it is a celebration of curiosity, conservation and the enduring power of nature to unite and inspire us all.", "spot": "This sculpture is located directly inside The Open Market space.", "url": "https://amazesussex.org.uk/sculptures/100-years-of-david/", "photo": "photos/bench-3.jpg", "lat": 50.83135, "lon": -0.13523}], "local": "The Open Market on London Road has been trading since the 1920s and was rebuilt in 2014. The bench by The Postman celebrates Sir David Attenborough's 100th birthday."}, {"n": 15, "km": 10.39, "leg": 500, "lat": 50.82878, "lon": -0.14059, "sculptures": [{"id": 6, "title": "Andromeda", "artist": "Bryony Crane", "place": "Brighton Station", "x": 1522, "y": 971, "about": "Bryony is a children’s illustrator, so she wanted to create an energetic, colourful bench to wow kids visiting the trail with some cosmic magic! This BookBench was inspired by enjoying all of the beautiful images coming from the James Webb Space Telescope over the last few years with her children. Bryony has painted expressive waves of cosmic dust in vibrant colours to lead the viewer on a journey around the bench, hopefully sparking their curiosity to go and read some lovely space-themed books!", "spot": "This sculpture is located inside Brighton Station.", "url": "https://amazesussex.org.uk/sculptures/andromeda/", "photo": "photos/bench-6.jpg", "lat": 50.82878, "lon": -0.14059}], "local": "Brighton Station opened in 1840. Its great curved iron roof was added in the 1880s."}, {"n": 16, "km": 10.61, "leg": 213, "lat": 50.82729, "lon": -0.14163, "sculptures": [{"id": 7, "title": "Hedgerow Haven", "artist": "Danni Smith", "place": "Queens Road", "x": 1484, "y": 1055, "about": "This bench celebrates our beautiful, biodiverse, and often ancient hedgerows. An essential habitat for many species of flora and fauna, providing shelter, food, wildlife corridors, and even helping to protect the land itself from erosion. The plants and animals featured here are local to Sussex, some of which are very vulnerable and others you probably have seen many times before. From Spindle to Ragwort, Robins to the elusive Hazel Dormouse, how many species can you find? Which is your favourite?", "spot": "The sculpture can be found on the left-hand side of Queens Road when facing towards the sea, around 200m from Brighton Station.", "url": "https://amazesussex.org.uk/sculptures/hedgerow-haven/", "photo": "photos/bench-7.jpg", "lat": 50.82729, "lon": -0.14163}], "local": "Queen's Road was cut in the 1840s to link the new railway station with the old town and the sea."}, {"n": 17, "km": 11.27, "leg": 660, "lat": 50.82762, "lon": -0.13514, "sculptures": [{"id": 5, "title": "Birds and Other Stories", "artist": "Katherine Griffin", "place": "St Peter's Church", "x": 1735, "y": 979, "about": "Borrowing its name from Daphne du Maurier’s collection, Katherine’s book bench, ‘Birds and Other Stories’, celebrates her love of nature, Brighton, and literature. It features some of her favourite birds, iconic Brighton imagery, and hidden clues referencing 13 works of literature. Painted in her signature style—bright colours, silhouettes, and the interplay of natural forms with human-made objects—this bench is for the curious. The first person to identify all 13 literary titles can contact Katherine on Instagram to win a Fine Art print!", "spot": "The sculpture is located adjacent to St Peters Church, on the flat, stoned surface by the green.", "url": "https://amazesussex.org.uk/sculptures/birds-and-other-stories/", "photo": "photos/bench-5.jpg", "lat": 50.82762, "lon": -0.13514}], "local": "St Peter's Church was designed by Charles Barry, later the architect of the Houses of Parliament, and completed in 1828."}, {"n": 18, "km": 11.89, "leg": 627, "lat": 50.82326, "lon": -0.13786, "sculptures": [{"id": 9, "title": "125 Years of Albion", "artist": "Jamie Eke", "place": "Brighton Museum", "x": 307, "y": 1489, "about": "Jamie Eke is a highly acclaimed, Brighton-based illustrator and designer, known for his sports-inspired comic-book style. A lifelong supporter himself, Jamie’s design brings together heritage and a sense of home, captured in the club’s iconic blue & white.", "spot": "The sculpture will be placed by the entrance to the Brighton Museum and Art Gallery.", "url": "https://amazesussex.org.uk/sculptures/125-years-of-albion/", "photo": "photos/bench-9.jpg", "lat": 50.82326, "lon": -0.13786}], "local": "Brighton Museum & Art Gallery sits in the Royal Pavilion estate. Brighton & Hove Albion were founded in 1901, so 2026 is their 125th year."}, {"n": 19, "km": 12.07, "leg": 172, "lat": 50.82487, "lon": -0.13846, "sculptures": [{"id": 8, "title": "You Are The Star Of Your Own Story Too", "artist": "Guy Parker-Rees", "place": "Jubilee Library", "x": 218, "y": 1265, "about": "This BookBench is a celebration of how sharing stories helps children to grow. Characters from Guy’s picture books, Gerald (Giraffes Can’t Dance), Dylan (CBeebies series Dylan’s Playtime Adventures) and Dave (Brave Dave) are joined by Little Mouse and Big Mouse from his latest book (Star Light, Star Bright). They are all encouraging you to make yourself the star of your own story.", "spot": "This sculpture is located in Jubilee Square, just outside of Jubilee Library.", "url": "https://amazesussex.org.uk/sculptures/you-are-the-star-of-your-own-story-too/", "photo": "photos/bench-8.jpg", "lat": 50.82487, "lon": -0.13846}], "local": "Jubilee Library opened in 2005 on Jubilee Square and has won awards for its design."}, {"n": 20, "km": 12.28, "leg": 216, "lat": 50.82259, "lon": -0.13821, "sculptures": [{"id": 10, "title": "A Dragon's Tale", "artist": "Fiona Blair", "place": "Pavilion Gardens Cafe", "x": 156, "y": 1527, "about": "Fiona is a Brighton-based artist and illustrator who took her inspiration for ‘A Dragon’s Tale’ from Sussex folklore; the legendary water dragon known as the Sussex Knucker. ‘Knucker’ is derived from the Anglo-Saxon word for nicor, (meaning “water monster”), and this particular Knucker is said to have inhabited a deep pond known as a ‘knuckerhole’ in Lyminster, near Arundel. Folklore has it that the King of Sussex offered his Daughter’s hand in marriage to anyone that could slay the dragon. A local lad named Jim Puttock is said to have done just that, by feeding it an enormous poisoned pie!", "spot": "The sculpture will be located in the Pavilion Gardens in the Royal Pavilion grounds.", "url": "https://amazesussex.org.uk/sculptures/a-dragons-tale/", "photo": "photos/bench-10.jpg", "lat": 50.82259, "lon": -0.13821}], "local": "The Pavilion Gardens have been replanted to follow John Nash's Regency design from the 1820s."}, {"n": 21, "km": 12.6, "leg": 314, "lat": 50.8207, "lon": -0.14031, "sculptures": [{"id": 12, "title": "Three Graces", "artist": "Sarah Arnett", "place": "Brighton Town Hall", "x": 1528, "y": 1353, "about": "This BookBench is Sarah’s love letter to summer by the sea — to lidos, butterflies, seaside plants and the endless comings and goings of swimmers. Inspired by the geometric shapes, long shadows and sun-bleached colours of painted seaside attractions, it is filled with memories of long summer holidays, chalk drawings on the promenade, and the smell of sun cream and melting tarmac beneath bare feet. The sights, sounds and atmosphere of her first summer job working on the merry-go-round on Brighton’s West Pier are fondly woven through the design. Like all her work, it celebrates colour, nostalgia and storytelling.", "spot": "The sculpture is located outside Brighton Town Hall and the Japanese Restaurant Moshimo.", "url": "https://amazesussex.org.uk/sculptures/three-graces/", "photo": "photos/bench-12.jpg", "lat": 50.8207, "lon": -0.14031}], "local": "Brighton Town Hall was built in the 1830s on Bartholomew Square. There is an old police cells museum in its basement."}, {"n": 22, "km": 12.79, "leg": 196, "lat": 50.81989, "lon": -0.14208, "sculptures": [{"id": 19, "title": "Packed Like Sardines", "artist": "Gill Prendergast", "place": "Fishing Museum", "x": 1479, "y": 1413, "about": "Brighton is a hugely popular holiday spot… you could say in the summer months it’s ‘packed like sardines’ on the beach! The backrest echoes a vintage sardine tin, while on the front they are free! The contrast of the two sides invites you to think about closeness and sharing space, while the bright pink background of the fish swimming freely echoes the energy and independence Brighton is known for, celebrating togetherness and individuality side by side.", "spot": "This sculpture is located on the seafront, directly in front of Brighton Fishing Museum.", "url": "https://amazesussex.org.uk/sculptures/packed-like-sardines/", "photo": "photos/bench-19.jpg", "lat": 50.81989, "lon": -0.14208}], "local": "This stretch of beach was the heart of Brighton's fishing community. The museum in the arches tells their story."}, {"n": 23, "km": 12.95, "leg": 154, "lat": 50.8193, "lon": -0.14001, "sculptures": [{"id": 18, "title": "Sweet Memory", "artist": "Ilona Drew", "place": "Beach Carousel", "x": 1540, "y": 1444, "about": "This BookBench features Brighton’s two iconic piers and the starling murmuration which occurs above them in Autumn and Winter. Inspired by these seafront attractions both tourist and locals alike will recognise them immediately on Ilona’s unique BookBench. Ilona’s work features a playful combination of bright colours, making her Bookbench an uplifting, nostalgic and peaceful addition to the collection. With the increase of AI in art, Ilona also notes the importance of the hand painted human element. In ‘Sweet Memory’, bright colours and nostalgic landmarks create a physical sense of Brighton, beyond the digital comprehension of the AI mind.", "spot": "This sculpture is located on the lower promenade, about a yard to the left of the carousel when facing towards the sea.", "url": "https://amazesussex.org.uk/sculptures/sweet-memory/", "photo": "photos/bench-18.jpg", "lat": 50.8193, "lon": -0.14001}], "local": "The carousel turns on the lower promenade just west of the Palace Pier."}, {"n": 24, "km": 13.21, "leg": 260, "lat": 50.82122, "lon": -0.13917, "sculptures": [{"id": 11, "title": "Rewild and Repose", "artist": "Francesca Grace", "place": "East Street", "x": 1562, "y": 1320, "about": "Drawn from Francesca’s own photographs taken at Knepp Rewilding Project, two scenes explore a landscape that she has revisited many times. The vivid, heightened colours transform the familiar into a dreamscape. Knepp has become a source of wonder and personal restoration. Look carefully for the clues as to how you can start your own adventure in this magical haven.", "spot": "The sculpture is located outside of the restaurant The House, just off of East Street on the brick paving.", "url": "https://amazesussex.org.uk/sculptures/rewild-and-repose/", "photo": "photos/bench-11.jpg", "lat": 50.82122, "lon": -0.13917}], "local": "East Street is one of the original streets of the old fishing town of Brighthelmstone, alongside West Street and North Street."}, {"n": 25, "km": 13.46, "leg": 254, "lat": 50.81929, "lon": -0.13644, "sculptures": [{"id": 16, "title": "Under the Brighton Rainbow", "artist": "JEylesDesigns", "place": "Palace Pier", "x": 1679, "y": 1438, "about": "This colourful creation celebrates everything Brighton- its famous landmarks, quirky charm, and the perpetual rainbow woven through the city’s bright soul. The front invites you to sit, relax, enjoy, snap a photo, and engage with art. Meanwhile, the back design is inspired by the very artwork that launched Jess’ artistic career. Both Brighton and this special artwork always inspire and remind Jess to do more of what she loves. Come, take a seat and enjoy Brighton’s vibrant spirit!", "spot": "The sculpture is located directly in front of Brighton Palace Pier.", "url": "https://amazesussex.org.uk/sculptures/under-the-brighton-rainbow/", "photo": "photos/bench-16.jpg", "lat": 50.81929, "lon": -0.13644}], "local": "Brighton Palace Pier opened in 1899 and is one of the UK's most visited free attractions."}, {"n": 26, "km": 13.78, "leg": 325, "lat": 50.82171, "lon": -0.13704, "sculptures": [{"id": 13, "title": "Tranquil", "artist": "Style in Design", "place": "War Memorial", "x": 1660, "y": 1307, "about": "Inspired by a love of Japanese art and based on a stained-glass panel by glass artist Emma. The koi fish symbolises good luck. It represents endurance in facing adversity and the perseverance to overcome life’s obstacles. The movement of the koi through the water gives the design depth. Emma features sunrises and sunsets in her stained-glass work and the crane, a symbol of peace, evokes serenity. The images are drawn the way a stained-glass panel would be created, like a glass jigsaw. Style in Design specialise in contemporary, handmade, stained and fused glass windows and sculptures.", "spot": "The sculpture will be located by the Royal Sussex Regiment Memorial in Old Steine.", "url": "https://amazesussex.org.uk/sculptures/tranquil/", "photo": "photos/bench-13.jpg", "lat": 50.82171, "lon": -0.13704}], "local": "The Old Steine was once open ground where fishermen dried their nets. The memorial honours the Royal Sussex Regiment."}, {"n": 27, "km": 14.77, "leg": 990, "lat": 50.8238, "lon": -0.12584, "sculptures": [{"id": 17, "title": "Brighton Skies", "artist": "Faye Bridgwater", "place": "Queen's Park", "x": 2060, "y": 1214, "about": "Inspired by the simple joy of looking up, the Brighton Skies bench was created by award-winning artist Faye Bridgwater, known for bold, expressive paintings of wild florals and uplifting landscapes. Her work, exhibited nationally including at the Saatchi Gallery, celebrates colour, connection and the changing Sussex light. Inspired by the Brighton Skies community, where over 78,000 members share daily photographs of the sky, this bench invites a moment to pause, reflect and reconnect with the beauty above.", "spot": "The sculpture will be located on the path in the gardens just off the South Avenue entrance.", "url": "https://amazesussex.org.uk/sculptures/brighton-skies/", "photo": "photos/bench-17.jpg", "lat": 50.8238, "lon": -0.12584}], "local": "Queen's Park was laid out in the 1820s and opened to the public in 1892. The bench is just inside the South Avenue entrance."}, {"n": 28, "km": 15.88, "leg": 1110, "lat": 50.81753, "lon": -0.12498, "sculptures": [{"id": 15, "title": "Seaside Watch", "artist": "Oleksandr Koltsov", "place": "Sea Lanes", "x": 2103, "y": 1560, "about": "Brighton is inextricably linked with its avian residents, who are omnipresent and ever-watchful. These birds have become an essential component of the city’s landscape, gracing rooftops, soaring through the sky, and frequenting the beaches along the coastline. One particular seagull, perched on a weathered pole, surveys its surroundings with a contemplative gaze. Much like a vigilant sentinel, it serves as a guardian of order. This narrative invites further elaboration, allowing individuals to draw upon their own experiences and imagination to enrich the story.", "spot": "The sculpture will be located along the seafront on Madeira Drive by the Sea Lanes.", "url": "https://amazesussex.org.uk/sculptures/seaside-watch/", "photo": "photos/bench-15.jpg", "lat": 50.81753, "lon": -0.12498}], "local": "Sea Lanes on Madeira Drive is a national open-water swimming centre with a seafront pool. Volk's Electric Railway, opened in 1883, runs alongside."}, {"n": 29, "km": 17.9, "leg": 2016, "lat": 50.81212, "lon": -0.10271, "sculptures": [{"id": 14, "title": "Magical Tails of the Sea", "artist": "Claire Havell", "place": "Brighton Marina", "x": 2059, "y": 583, "about": "Magical Tails of the Sea is a celebration of the beauty of the ocean and the magical tales of mermaids and other sea creatures from myth and legend. On the front is a shining pearl inside a glittering magical clam – designed so it looks like you’re inside the clam when you’re sitting on the bench. On the back is a group of colourful merfolk picking up litter from the sea floor, with an important reminder to look after our precious oceans and keep them clean.", "spot": "The sculpture will be located along the Mermaid Walk.", "url": "https://amazesussex.org.uk/sculptures/magical-tails-of-the-sea/", "photo": "photos/bench-14.jpg", "lat": 50.81212, "lon": -0.10271}], "local": "Brighton Marina was built in the 1970s and opened in 1978. The bench is on Mermaid Walk, reached by the level 6 crossing from the multi-storey car park.", "q": "Mermaid Walk, Brighton Marina"}]};

function clamp(){const r=map.getBoundingClientRect(),w=DATA.w*s,h=DATA.h*s;
  tx=w<r.width?(r.width-w)/2:Math.min(0,Math.max(r.width-w,tx));
  ty=h<r.height?(r.height-h)/2:Math.min(0,Math.max(r.height-h,ty))}

  layer.classList.add('fly');apply();setTimeout(()=>layer.classList.remove('fly'),650)}

let follow=false,watching=false,me=null,arrived={};
function toPx(lat,lon){const fi=(lat-GRID.la0)/GRID.st,fj=(lon-GRID.lo0)/GRID.st;
  if(fi<0||fj<0||fi>=GRID.nla-1||fj>=GRID.nlo-1)return null;
  const i=Math.floor(fi),j=Math.floor(fj),u=fi-i,v=fj-j,k=(a,b)=>a*GRID.nlo+b;
  const f=A=>A[k(i,j)]*(1-u)*(1-v)+A[k(i,j+1)]*(1-u)*v+A[k(i+1,j)]*u*(1-v)+A[k(i+1,j+1)]*u*v;
  return{x:f(GRID.x),y:f(GRID.y)}}
// stops drawn only in an inset box: point at their real spot on the main map instead
function target(st){const m=st.sculptures[0],q=toPx(st.lat,st.lon);return q&&Math.hypot(q.x-m.x,q.y-m.y)>200?q:m}
function metres(a,b,c,d){const R=6371000,r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.hypot(x,y)*R}
function fmt(m){return m<1000?Math.round(m/5)*5+' m':(m/1000).toFixed(1)+' km'}
function onPos(p){const {latitude:la,longitude:lo,accuracy:ac}=p.coords;me={la,lo};

  const on=q&&q.x>=0&&q.y>=0&&q.x<=DATA.w&&q.y<=DATA.h;
  $('me').hidden=$('acc').hidden=!on;
  if(on){$('me').style.left=$('acc').style.left=q.x+'px';$('me').style.top=$('acc').style.top=q.y+'px';
    const q2=toPx(la+ac/111320,lo),r=q2?Math.abs(q2.y-q.y):0;$('acc').style.width=$('acc').style.height=(2*r)+'px';$('acc').style.margin=(-r)+'px 0 0 '+(-r)+'px';
    note.hidden=true;if(follow)fly(q.x,q.y,Math.max(s,.9))}
  else{note.textContent='You are off the edge of this map. Use Walk there for directions.';note.hidden=false}
  updateAway()}
function updateAway(){if(!me){$('away').textContent='';return}

// ---- small benches

const nFoundS=()=>SMALL.filter(b=>foundS[b.id]).length;
const BOOK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2 3v14h9V5z"/></svg>';
function placeVenues(){VENUES.forEach(v=>{const b=v.benches[0],q=toPx(b.lat,b.lon);if(!q||q.x<0||q.y<0||q.x>DATA.w||q.y>DATA.h)return;
  v.px=q;v.dot=document.createElement('div');v.dot.className='sv';v.dot.innerHTML=BOOK;v.dot.style.left=q.x+'px';v.dot.style.top=q.y+'px';layer.appendChild(v.dot)});drawVenues()}
function drawVenues(){VENUES.forEach(v=>{if(!v.dot)return;v.dot.classList.toggle('done',v.benches.every(b=>foundS[b.id]));v.dot.hidden=filter==='big'})}
// A small bench row with a tick and a where/when panel; after() runs once it's toggled.
function smallLi(b,after){const li=document.createElement('li');li.className=foundS[b.id]?'found':'';li.tabIndex=0;li.setAttribute('role','checkbox');li.setAttribute('aria-checked',!!foundS[b.id]);
  li.innerHTML=`<span class="t"><b></b><em></em></span><button class="info" aria-expanded="false" aria-label="Where to find it">i</button><span class="tick">&#10003;</span><div class="detail" hidden><p class="spot"></p><p class="hours"></p><a target="_blank" rel="noopener">Official page</a> · <a class="dir" target="_blank" rel="noopener">Directions</a></div>`;
  li.querySelector('b').textContent=b.title;li.querySelector('em').textContent=b.by;
  const det=li.querySelector('.detail'),ib=li.querySelector('.info');
  det.querySelector('.spot').textContent=b.spot;det.querySelector('.hours').textContent=b.hours.length?'Opening times\n'+b.hours.join('\n'):'';
  det.querySelector('a').href=b.url;det.querySelector('.dir').href=`https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}&travelmode=walking`;
  ib.onclick=e=>{e.stopPropagation();det.hidden=!det.hidden;ib.setAttribute('aria-expanded',!det.hidden)};det.onclick=e=>e.stopPropagation();
  const tog=()=>{foundS[b.id]=!foundS[b.id];saveS();li.className=foundS[b.id]?'found':'';li.setAttribute('aria-checked',!!foundS[b.id]);drawVenues();setCount();
    if(foundS[b.id]){burst(li);toast(nFoundS()===SMALL.length?'Every small bench found!':'Small but mighty!')}after()};
  li.onclick=tog;li.onkeydown=e=>{if(e.target===li&&(e.key===' '||e.key==='Enter')){e.preventDefault();tog()}};return li}
function setCount(){const n=nFound(),k=nFoundS(),N=SMALL.length;

  $('bar').style.width=(filter==='big'?n/TOTAL:filter==='small'?k/N:(n+k)/(TOTAL+N))*100+'%'}

const SR=()=>SROUTES[sr]||SROUTES[0];

function curTarget(){return filter==='small'?(curVenue().px||null):target(DATA.stops[cur])}

  const loc=$('local'),sel=document.createElement('select');loc.innerHTML='';sel.className='sroute';sel.setAttribute('aria-label','Small bench route');
